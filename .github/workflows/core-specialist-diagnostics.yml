name: Core specialist diagnostics
on:
  pull_request:
    paths:
      - "nawnie_server.py"
      - "agent_diagnostics.py"
      - "specialist_agents.py"
      - "test_agent_diagnostics.py"
      - ".github/workflows/core-specialist-diagnostics.yml"
  workflow_dispatch:
jobs:
  diagnosis-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax checks
        run: python -m py_compile nawnie_server.py agent_diagnostics.py specialist_agents.py test_agent_diagnostics.py
      - name: Isolated diagnostic tests
        run: python -m unittest -v test_agent_diagnostics
